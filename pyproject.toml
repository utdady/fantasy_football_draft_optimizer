[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draftopt"
version = "0.1.0"
description = "Fantasy football draft optimizer (V1: marginal lineup value + backtest)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
draftopt-ingest = "draftopt.ingest:main"
draftopt-serve = "draftopt.serve:main"
draftopt-backtest = "draftopt.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
