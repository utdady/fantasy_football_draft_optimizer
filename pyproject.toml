[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "draftopt"
version = "0.1.0"
description = "Fantasy football draft optimizer (V1: marginal lineup value + backtest)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
eval = ["nflreadpy>=0.1"]

[project.scripts]
draftopt-ingest = "draftopt.ingest:main"
draftopt-serve = "draftopt.serve:main"
draftopt-backtest = "draftopt.backtest:main"
draftopt-diagnose-vor = "draftopt.diagnose_vor:main"
draftopt-audit-curves = "draftopt.audit_proj_curves:main"
draftopt-trace-divergence = "draftopt.trace_divergence:main"
draftopt-case-study-pick20 = "draftopt.case_study_pick20:main"
draftopt-case-study-v2alpha = "draftopt.case_study_v2alpha_long_wait:main"
draftopt-trace-v2 = "draftopt.trace_v2_divergence:main"
draftopt-stress-opponent = "draftopt.stress_opponent:main"
draftopt-latency = "draftopt.latency_bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
